<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="DC Woodball player portrait">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c22"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd75e"/>
      <stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.4" fill="#f6f4f0" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#dots)"/>
  <g opacity="0.55">
    <path d="M-100 600 L280 -40 L380 -40 L0 600 Z" fill="#f6f4f0" fill-opacity="0.045"/>
    <path d="M120 600 L500 -40 L560 -40 L180 600 Z" fill="url(#gold)" fill-opacity="0.12"/>
  </g>
  <!-- jersey silhouette -->
  <g fill="none" stroke="url(#gold)" stroke-width="3" stroke-opacity="0.75">
    <path d="M300 200 L400 250 L500 200 L560 250 L540 330 L500 315 L500 600 L300 600 L300 315 L260 330 L240 250 Z"/>
  </g>
  <text x="400" y="470" text-anchor="middle" font-family="'Arial Black',Impact,sans-serif" font-size="200" font-weight="900" fill="url(#gold)" fill-opacity="0.92">07</text>
  <text x="400" y="540" text-anchor="middle" font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',Oswald,Arial,sans-serif" font-size="34" font-weight="700" letter-spacing="8" fill="#f6f4f0" fill-opacity="0.8">陳定淳</text>
  <rect x="14" y="14" width="772" height="572" fill="none" stroke="#f6f4f0" stroke-opacity="0.18" stroke-width="2"/>
</svg>
